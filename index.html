<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Stargazers log</h1>
      <p>A log of the repositories I've starred.</p>

      <p id="status" role="status" aria-live="polite">Loading…</p>
      <ul id="starred" aria-labelledby="status"></ul>

      <noscript>
        <p>This page needs JavaScript to display the list of starred repositories.</p>
      </noscript>
    </main>
  </body>
</html>
